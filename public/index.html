<script>
        async function fetchMedia() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            if (!urlInput) {
                alert('Please paste a valid YouTube or Instagram link.');
                return;
            }

            const loadingState = document.getElementById('loadingState');
            const resultContainer = document.getElementById('resultContainer');
            const fetchBtn = document.getElementById('fetchBtn');

            loadingState.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            fetchBtn.disabled = true;

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();
                loadingState.classList.add('hidden');
                fetchBtn.disabled = false;

                if (!response.ok) {
                    alert(data.error || 'Failed to process link.');
                    return;
                }

                document.getElementById('resTitle').textContent = data.title;
                document.getElementById('resThumbnail').src = data.thumbnail || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600';
                document.getElementById('resPlatform').textContent = data.platform.toUpperCase();

                const optionsList = document.getElementById('downloadOptionsList');
                optionsList.innerHTML = `
                    <button onclick="downloadFile('${data.videoUrl}', '${data.title}.mp4')" class="w-full glass-card p-4 rounded-2xl flex items-center justify-between hover:border-indigo-500/50 transition-all group text-left">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-all">
                                <i class="fa-solid fa-video"></i>
                            </div>
                            <div>
                                <h5 class="font-bold text-sm text-slate-200">Download Video (MP4)</h5>
                                <p class="text-xs text-slate-400">High Quality Stream</p>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-all">
                            <i class="fa-solid fa-download"></i>
                        </div>
                    </button>
                    <button onclick="downloadFile('${data.audioUrl}', '${data.title}.mp3')" class="w-full glass-card p-4 rounded-2xl flex items-center justify-between hover:border-purple-500/50 transition-all group text-left">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center group-hover:bg-purple-600 group-hover:text-white transition-all">
                                <i class="fa-solid fa-music"></i>
                            </div>
                            <div>
                                <h5 class="font-bold text-sm text-slate-200">Download Audio (MP3)</h5>
                                <p class="text-xs text-slate-400">High Quality Track</p>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center group-hover:bg-purple-600 group-hover:text-white transition-all">
                            <i class="fa-solid fa-download"></i>
                        </div>
                    </button>
                `;

                resultContainer.classList.remove('hidden');

            } catch (err) {
                loadingState.classList.add('hidden');
                fetchBtn.disabled = false;
                alert('Network error or server connection failed.');
            }
        }

        // Secure client-side blob downloader to prevent HTML file saving errors
        async function downloadFile(fileUrl, filename) {
            if (!fileUrl) {
                alert('Download stream unavailable.');
                return;
            }
            try {
                const response = await fetch(`/api/proxy-download?url=${encodeURIComponent(fileUrl)}`);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename.replace(/[/\\?%*:|"<>]/g, '_'); // Sanitize filename
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                // Fallback direct open if proxy fails
                window.open(fileUrl, '_blank');
            }
        }
    </script>
